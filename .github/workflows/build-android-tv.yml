name: Build Android TV APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-tv/**'
      - 'dist/userScript.js'
      - 'standalone/icon.png'
      - 'standalone/icon_16b9.png'
      - '.github/workflows/build-android-tv.yml'
  push:
    branches: ['main']
    paths:
      - 'android-tv/**'
      - 'dist/userScript.js'
      - 'standalone/icon.png'
      - 'standalone/icon_16b9.png'
      - '.github/workflows/build-android-tv.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android-tv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TizenTube-AndroidTV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
