name: "CodeQL"

on:
  # Pushes to main and the weekly sweep, but deliberately not pull_request.
  #
  # Every change arrives through a pull request that is then fast-forwarded
  # onto main, so analysing both meant analysing the same tree twice: half of
  # this repository's CodeQL runs were duplicates of the other half.
  #
  # Keeping the push side rather than the pull_request side is the deliberate
  # half of that choice. Code scanning treats analyses of the default branch
  # as the state of the project, which is what the Security tab lists and what
  # gets fixed from; a pull_request-only setup leaves that state to the weekly
  # cron. The cost is that a newly introduced alert shows up just after a merge
  # instead of just before, which is how the alerts in this repository have
  # actually been found and fixed.
  push:
    branches: ["main"]
  schedule:
    - cron: '23 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - dist/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"